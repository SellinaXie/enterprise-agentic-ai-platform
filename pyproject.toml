[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-transformation-advisor"
version = "0.7.5"
description = "Enterprise document ingestion with grounded multi-agent GraphRAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=0.2.45,<2.0",
    "openai>=2.0,<3.0",
    "pgvector>=0.5,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.2,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "sqlalchemy>=2.0.36,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "postgres: requires a dedicated PostgreSQL test database configured via TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
